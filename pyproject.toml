[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prewster"
dynamic = ["version"]
description = "Native GTK4 monitor for GitHub review requests: tray icon, notifications, in-app diffs, and headless Claude Code skills on a PR"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Matthías Sigurbjörnsson" }]
keywords = ["github", "pull-request", "code-review", "gtk4", "libadwaita", "waybar", "claude-code"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: GTK",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = ["requests>=2.28", "PyGObject>=3.46", "pycairo>=1.20"]

[project.urls]
Homepage = "https://github.com/MattiSig/PRewster"
Issues = "https://github.com/MattiSig/PRewster/issues"
Changelog = "https://github.com/MattiSig/PRewster/releases"

[project.scripts]
prewster = "prewster.main:main"
prewster-waybar = "prewster.waybar:main"

[tool.setuptools]
packages = ["prewster"]

[tool.setuptools.package-data]
prewster = ["icons/*.svg", "sounds/*.oga"]

[tool.setuptools.dynamic]
version = { attr = "prewster.__version__" }
